<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Margube App · Iniciar sesión</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.ap{--tx:#EDF1F3;--mut:#9DA9B2;--glass:rgba(20,27,33,.6);--glassln:rgba(255,255,255,.14);--fld:rgba(255,255,255,.06);--fldln:rgba(255,255,255,.13);--focus:var(--acc);--acctx:var(--acc);--errtx:#FF9E9E;--btn2:rgba(255,255,255,.08)}
.ap.light{--tx:#0C1014;--mut:#46525D;--glass:rgba(250,251,252,.86);--glassln:rgba(255,255,255,.9);--fld:rgba(12,16,20,.045);--fldln:rgba(12,16,20,.13);--focus:#0C1014;--acctx:#0C1014;--errtx:#B42318;--btn2:rgba(12,16,20,.06)}
.ap *{box-sizing:border-box}
.ap a{color:var(--tx);text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:4px}
.ap a:hover{color:var(--acctx)}
.ap :focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* hero */
.hero{background-color:#0B0F12;background-image:radial-gradient(rgba(237,241,243,.075) 1px,transparent 1.3px);background-size:18px 18px}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:var(--acc);opacity:.13;filter:blur(70px);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25);opacity:.2}}
.lg{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);color:#EDF1F3}
.tag{font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#B8C2C9}
.mono-grid{display:grid;grid-template-columns:repeat(11,18px);gap:6px}
.tile{width:18px;height:18px;border-radius:5px;display:block}
.tile.on{background:var(--acc);animation:wave 3.4s cubic-bezier(.6,0,.4,1) infinite backwards}
@keyframes wave{0%,100%{transform:scale(.5);border-radius:50%;opacity:.5}45%{transform:scale(1);border-radius:5px;opacity:1}}
.tile.off{background:rgba(237,241,243,.055);box-shadow:inset 0 0 0 1px rgba(237,241,243,.06);transition:background 1.4s ease-out;animation:twinkle 7s ease-in-out infinite backwards}
.tile.off:hover,.tile.off:active{background:var(--acc);transition:background 0s}
@keyframes twinkle{0%,86%,100%{box-shadow:inset 0 0 0 1px rgba(237,241,243,.06)}92%{box-shadow:inset 0 0 0 1px var(--acc)}}
.scan{position:absolute;left:-20px;right:-20px;top:0;height:2px;background:var(--acc);box-shadow:0 0 16px 2px var(--acc);opacity:0;pointer-events:none;animation:scan 6.5s cubic-bezier(.6,0,.4,1) 1.4s infinite}
@keyframes scan{0%{top:0;opacity:0}8%{opacity:.5}48%{top:100%;opacity:.5}56%{top:100%;opacity:0}100%{top:100%;opacity:0}}

/* hoja de cristal */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:10px 22px 30px;border-radius:34px 34px 0 0;background:var(--glass);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border-top:1px solid var(--glassln);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 -24px 60px rgba(0,0,0,.35);color:var(--tx);animation:sheetIn 1s cubic-bezier(.2,.85,.2,1) .15s backwards}
@keyframes sheetIn{from{transform:translateY(70%)}}
.grab{width:38px;height:5px;border-radius:5px;background:var(--fldln);margin:0 auto 18px}
.hello{display:inline-flex;align-items:center;gap:9px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.pulse{position:relative;width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--acc);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.8);opacity:0}}
.squig{position:absolute;left:-2%;bottom:-.18em;width:104%;height:.34em;overflow:visible}
.draw-in{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1s cubic-bezier(.6,0,.2,1) .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.fld{position:relative;display:block}
.fld input{width:100%;height:56px;border:1px solid var(--fldln);background:var(--fld);color:var(--tx);border-radius:18px;padding:22px 54px 6px 48px;font:500 16px/1.2 'Bricolage Grotesque',system-ui,sans-serif;outline:none;transition:border-color .25s,box-shadow .25s}
.fld input:focus{border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 24%,transparent)}
.fld label{position:absolute;left:48px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:15px;pointer-events:none;transition:all .3s cubic-bezier(.2,.7,.2,1)}
.fld input:focus + label,.fld input:not(:placeholder-shown) + label{top:16px;font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acctx)}
.fld .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mut);display:grid;place-items:center;transition:color .25s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.fld:focus-within .ico{color:var(--acctx);transform:translateY(-50%) rotate(-8deg) scale(1.12)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--mut);border-radius:14px;display:grid;place-items:center;cursor:pointer}
.eye:active{background:var(--btn2)}

.chk{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--tx);min-height:44px}
.chk input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chk .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--mut);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.chk:active .box{transform:scale(.82)}
.chk input:checked + .box{background:var(--acc);border-color:var(--acc)}
.chk .box path{stroke:#0A0E11;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s .05s}
.chk input:checked + .box path{stroke-dashoffset:0}
.chk input:focus-visible + .box{outline:2px solid var(--focus);outline-offset:3px}

.go{position:relative;overflow:hidden;width:100%;height:56px;border:0;border-radius:18px;background:var(--acc);color:#0A0E11;font:650 16px/1 'Bricolage Grotesque',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.go:active{transform:scale(.96)}
.go::before{content:'';position:absolute;top:0;bottom:0;left:-45%;width:26%;background:rgba(255,255,255,.42);transform:skewX(-20deg);animation:shine 4.5s cubic-bezier(.6,0,.2,1) 2.2s infinite}
@keyframes shine{0%{left:-45%}22%,100%{left:125%}}
.go[disabled]{cursor:progress}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(10,14,17,.25);border-top-color:#0A0E11;display:block;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--fldln)}
.bio{width:100%;height:54px;border-radius:18px;border:1px solid var(--fldln);background:var(--btn2);color:var(--tx);font:600 15px/1 'Bricolage Grotesque',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.bio:active{transform:scale(.96)}
.fid{position:relative;width:24px;height:24px;display:block;color:var(--acctx)}
.fid .sl{position:absolute;left:2px;right:2px;top:2px;height:2px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc);opacity:0}
.fid.scanning .sl{animation:fscan 1.1s ease-in-out infinite}
.fid.scanning svg{animation:fpulse 1.1s ease-in-out infinite}
@keyframes fscan{0%{top:2px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:20px;opacity:0}}
@keyframes fpulse{50%{transform:scale(.88)}}

.err{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,#FF5C5C 14%,transparent);color:var(--errtx);font-size:13.5px;line-height:1.4;margin:0;animation:rise .35s backwards}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

/* éxito */
.done{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:40px 28px;background:rgba(11,15,18,.55);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);color:#EDF1F3;animation:fade .5s ease backwards}
@keyframes fade{from{opacity:0}}
.ring{stroke-dasharray:252;stroke-dashoffset:252;animation:draw .9s cubic-bezier(.6,0,.2,1) .2s forwards}
.tick{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s cubic-bezier(.6,0,.2,1) .9s forwards}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px;animation:fill 2.8s cubic-bezier(.6,0,.2,1) .6s forwards}
@keyframes fill{to{width:100%}}
.linkbtn{background:none;border:0;padding:10px 0;min-height:44px;font:500 15px/1 'Bricolage Grotesque',system-ui,sans-serif;color:#EDF1F3;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;align-self:flex-start}

.ap.still *,.ap.still *::before,.ap.still *::after{animation:none!important;transition:none!important}
.ap.still .draw-in,.ap.still .ring,.ap.still .tick{stroke-dashoffset:0!important}
.ap.still .bar i{width:100%!important}
@media (prefers-reduced-motion:reduce){
.ap *,.ap *::before,.ap *::after{animation:none!important;transition:none!important}
.ap .draw-in,.ap .ring,.ap .tick{stroke-dashoffset:0!important}
.ap .bar i{width:100%!important}
}
</style>
</helmet>

<div class="ap {{themeClass}} {{motionClass}}" style="--acc: {{accent}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0F12; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<div class="hero" style="position: absolute; left: 0; right: 0; top: 0; height: 400px; display: flex; flex-direction: column; align-items: center; padding-top: 58px; gap: 30px">
<span class="glow" aria-hidden="true" style="top: 80px"></span>
<div class="lg rise">
<svg width="30" height="30" viewBox="0 0 38 38" role="img" aria-label="Logotipo de Margube"><rect width="38" height="38" rx="19" style="fill: var(--acc)"></rect><path d="M11 26V12l8 9 8-9v14" fill="none" stroke="#0A0E11" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 17px; font-weight: 700; letter-spacing: -0.03em">Margube</span>
<span class="tag">Intranet</span>
</div>
<div class="rise" style="position: relative; animation-delay: .25s">
<div class="mono-grid" aria-hidden="true">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="99">
<span class="{{t.cls}}" style="animation-delay: {{t.delay}}"></span>
</sc-for>
</div>
<span class="scan" aria-hidden="true"></span>
</div>
</div>

<section class="sheet" aria-label="Iniciar sesión">
<div class="grab" aria-hidden="true"></div>
<div class="{{cardClass}}" style="display: flex; flex-direction: column; gap: 10px">
<div class="rise" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; animation-delay: .5s">
<span class="hello"><span class="pulse"></span>{{greet}}</span>
<h1 style="margin: 0; font-size: 34px; line-height: 1; font-weight: 750; letter-spacing: -0.045em">Inicia <span style="position: relative; display: inline-block">sesión<svg class="squig" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path class="draw-in" d="M3 13 C 40 4, 70 18, 105 9 S 170 4, 197 11" fill="none" stroke-width="5" stroke-linecap="round" style="stroke: var(--acc)"></path></svg></span></h1>
</div>

<form class="rise" onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 10px; animation-delay: .6s">
<div class="fld">
<span class="ico" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 7l8 6 8-6"></path></svg></span>
<input id="ap-email" type="text" name="email" autocomplete="username" placeholder=" " value="{{email}}" onChange="{{onEmail}}">
<label for="ap-email">Correo corporativo</label>
</div>
<div class="fld">
<span class="ico" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path><path d="M12 15v2"></path></svg></span>
<input id="ap-pass" type="{{pwType}}" name="password" autocomplete="current-password" placeholder=" " value="{{pw}}" onChange="{{onPw}}">
<label for="ap-pass">Contraseña</label>
<button type="button" class="eye" aria-label="{{eyeLabel}}" onClick="{{toggleShow}}">
<sc-if value="{{show}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c5.5 0 9 5.5 9 7a11 11 0 0 1-2.6 3.4"></path><path d="M6.5 6.6C4.3 8 3 10.6 3 12c0 1.5 3.5 7 9 7a9.6 9.6 0 0 0 4.9-1.3"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></sc-if>
<sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c0-1.5 3.5-7 9-7s9 5.5 9 7-3.5 7-9 7-9-5.5-9-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
</button>
</div>

<sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}">
<p class="err" role="alert"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.5"></path></svg><span>{{err}}</span></p>
</sc-if>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<label class="chk"><input type="checkbox" checked="{{remember}}" onChange="{{toggleRemember}}"><span class="box" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 22 22" fill="none"><path d="M5 11.5l4 4 8-9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Recordarme</label>
<a href="#recuperar" style="font-size: 14px; padding: 12px 0">¿Olvidaste la contraseña?</a>
</div>

<button type="submit" class="go" disabled="{{busy}}">
<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><span class="spin" aria-hidden="true"></span></sc-if>
<span style="position: relative">{{btnLabel}}</span>
</button>

<div class="or" style="margin: 6px 0">o</div>

<button type="button" class="bio" onClick="{{faceId}}" disabled="{{busy}}">
<span class="{{fidClass}}" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8"></path><path d="M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8"></path><path d="M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16"></path><path d="M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"></path><path d="M9 9v1.5"></path><path d="M15 9v1.5"></path><path d="M12 9v4h-1"></path><path d="M9 16c1.6 1.3 4.4 1.3 6 0"></path></svg><span class="sl"></span></span>
<span>{{bioLabel}}</span>
</button>

<p style="margin: 6px 0 0; text-align: center; font-size: 12.5px; line-height: 1.4; color: var(--mut)">La sesión se cierra tras 1 minuto de inactividad.</p>
</form>
</div>
</section>

<sc-if value="{{isSuccess}}" hint-placeholder-val="{{ false }}">
<div class="done" role="status">
<svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="40" fill="none" stroke-width="3" stroke="rgba(255,255,255,0.15)"></circle><circle class="ring" cx="46" cy="46" r="40" fill="none" stroke-width="3" stroke-linecap="round" transform="rotate(-90 46 46)" style="stroke: var(--acc)"></circle><path class="tick" d="M30 47l11 11 22-24" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--acc)"></path></svg>
<div class="rise" style="display: flex; flex-direction: column; gap: 12px; animation-delay: .6s">
<span class="hello" style="color: #B8C2C9"><span class="pulse"></span>{{greet}}</span>
<h1 style="margin: 0; font-size: 40px; line-height: 1; font-weight: 750; letter-spacing: -0.045em">Ya estás dentro.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #B8C2C9">Sesión iniciada {{who}}. Preparando tu panel…</p>
</div>
<div class="bar" aria-hidden="true"><i></i></div>
<button type="button" class="linkbtn" onClick="{{reset}}">Usar otra cuenta</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Tema"},"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#FF7A45","#5BD6F5","#B79CFF"],"section":"Tema"},"motion":{"editor":"boolean","default":true,"section":"Animaciones"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', pw: '', show: false, remember: true, phase: 'idle', via: '', err: '', shake: false, now: Date.now() };
    var tiles = [];
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 11; c++) {
        var on = c <= 1 || c >= 9 || (r <= 4 && (c === r || c === r + 1 || c === 10 - r || c === 9 - r)) || (r === 5 && c === 5);
        var d = on ? ((r + c) * 0.09).toFixed(2) + 's' : (((r * 7 + c * 13) % 23) * 0.31).toFixed(2) + 's';
        tiles.push({ cls: on ? 'tile on' : 'tile off', delay: d });
      }
    }
    this.tiles = tiles;
  }
  componentDidMount() {
    var self = this;
    this.iv = setInterval(function () { self.setState({ now: Date.now() }); }, 30000);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearTimeout(this.t1); clearTimeout(this.t2);
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var dark = this.props.dark ?? true;
    var motion = this.props.motion ?? true;
    var accent = this.props.accent ?? '#C6F432';
    var hour = 12;
    try {
      hour = parseInt(new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: 'numeric', hour12: false }).format(new Date(s.now)), 10);
    } catch (e) {}
    var greet = hour < 6 ? 'Buenas noches' : hour < 14 ? 'Buenos días' : hour < 21 ? 'Buenas tardes' : 'Buenas noches';
    function fail(msg) {
      self.setState({ err: msg, shake: true });
      clearTimeout(self.t1);
      self.t1 = setTimeout(function () { self.setState({ shake: false }); }, 480);
    }
    var loading = s.phase === 'loading';
    var scanning = s.phase === 'scan';
    var busy = loading || scanning;
    return {
      themeClass: dark ? 'dark' : 'light',
      motionClass: motion ? '' : 'still',
      accent: accent,
      tiles: this.tiles,
      greet: greet,
      email: s.email,
      pw: s.pw,
      pwType: s.show ? 'text' : 'password',
      show: s.show,
      hidden: !s.show,
      eyeLabel: s.show ? 'Ocultar contraseña' : 'Mostrar contraseña',
      remember: s.remember,
      hasErr: !!s.err,
      err: s.err,
      cardClass: s.shake ? 'shake' : '',
      loading: loading,
      busy: busy,
      btnLabel: loading ? 'Verificando…' : 'Entrar',
      fidClass: scanning ? 'fid scanning' : 'fid',
      bioLabel: scanning ? 'Escaneando rostro…' : 'Entrar con Face ID',
      isSuccess: s.phase === 'success',
      who: s.via === 'bio' ? 'con Face ID' : 'como ' + s.email,
      onEmail: function (e) { self.setState({ email: e.target.value, err: '' }); },
      onPw: function (e) { self.setState({ pw: e.target.value, err: '' }); },
      toggleShow: function () { self.setState({ show: !self.state.show }); },
      toggleRemember: function () { self.setState({ remember: !self.state.remember }); },
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (self.state.phase !== 'idle') return;
        var em = (self.state.email || '').trim();
        if (!em || !self.state.pw) { fail('Introduce tu correo y tu contraseña.'); return; }
        if (!/^\S+@\S+\.\S+$/.test(em)) { fail('Revisa el correo (nombre@dominio.com).'); return; }
        self.setState({ phase: 'loading', via: 'pw', err: '' });
        clearTimeout(self.t2);
        self.t2 = setTimeout(function () { self.setState({ phase: 'success' }); }, 1500);
      },
      faceId: function () {
        if (self.state.phase !== 'idle') return;
        self.setState({ phase: 'scan', via: 'bio', err: '' });
        clearTimeout(self.t2);
        self.t2 = setTimeout(function () { self.setState({ phase: 'success' }); }, 1800);
      },
      reset: function () {
        self.setState({ phase: 'idle', via: '', pw: '', show: false, email: self.state.remember ? self.state.email : '' });
      }
    };
  }
}
</script>
</body>
</html>
