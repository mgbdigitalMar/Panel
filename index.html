<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Margube Intranet — Plataforma corporativa para gestión de reservas, solicitudes, noticias y equipo." />
    <!-- Same colour as the page, so browser bars blend in. ThemeProvider keeps it in sync with the app theme. -->
    <meta name="theme-color" content="#E4EBFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1428" media="(prefers-color-scheme: dark)" />
    <!-- Added to the home screen: full screen, content under the status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Margube · Intranet Corporativa" />
    <meta property="og:description" content="Plataforma interna para el equipo Margube." />
    <meta property="og:image" content="/src/assets/logos/logo-color.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Margube · Intranet" />

    <title>Margube · Intranet Corporativa</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Fonts — Inter for UI text, Poppins (the wordmark face) for headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Saved theme and appearance before the first paint (main.jsx sets the same), so the
         canvas under Safari's bars has the right colour from the start -->
    <script>
      (function () {
        var d = document.documentElement, m = 'dark', a = 'glass';
        try { m = localStorage.getItem('app-theme-mode') || 'dark'; a = localStorage.getItem('app-appearance') === 'classic' ? 'classic' : 'glass'; } catch (e) {}
        if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-theme', m);
        d.setAttribute('data-appearance', a);
      })();
    </script>
    <!-- Critical CSS: canvas colour (same values as global.scss) and the skip link, before the bundle -->
    <style>
      html, body { margin: 0; }
      html { background: #0A0C10; }
      html[data-theme='light'] { background: #F2F4F8; }
      html[data-appearance='glass'][data-theme='dark'] { background: #0C1428; }
      html[data-appearance='glass'][data-theme='light'] { background: #E4EBFB; }
      .skip-link { position: absolute; top: -100px; left: 16px; }
      .skip-link:focus { top: 16px; }
    </style>
  </head>
  <body>
    <!-- Skip navigation link for keyboard/screen reader accessibility -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
