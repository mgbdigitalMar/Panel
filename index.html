<!DOCTYPE html>
<html lang="es" data-appearance="glass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Margube Intranet — Plataforma corporativa para gestión de reservas, solicitudes, noticias y equipo." />
    <!-- Let Safari sample the page rather than requesting a solid toolbar tint. -->
    <!-- Added to the home screen: full screen, content under the status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Margube · Intranet Corporativa" />
    <meta property="og:description" content="Plataforma interna para el equipo Margube." />
    <meta property="og:image" content="/src/assets/logos/logo-color.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Margube · Intranet" />

    <title>Margube · Intranet Corporativa</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <!-- Opaque and square: iOS rounds it, and from it builds the dark, tinted and clear (glass)
         home screen variants itself; a web page cannot hand iOS those variants directly -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts are self-hosted (main.jsx) and swap in when ready. Deliberately not preloaded: no
         text exists until the app's JavaScript renders it, and a preloaded font competed with that
         JavaScript for the connection. Measured on a throttled phone, the preload delayed the first
         paint by ~130 ms and the dashboard's largest paint by ~120 ms. -->
    <!-- Saved theme before the first paint (main.jsx sets the same), so the canvas under
         Safari's bars has the right colour from the start -->
    <script>
      (function () {
        var m = 'dark';
        try { m = localStorage.getItem('app-theme-mode') || 'dark'; } catch (e) {}
        if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', m);
        var glass = 'normal';
        try { glass = localStorage.getItem('margube-glass-intensity') || 'normal'; } catch (e) {}
        document.documentElement.dataset.glassIntensity = ['off', 'soft', 'normal', 'strong'].indexOf(glass) >= 0 ? glass : 'normal';
      })();
    </script>
    <!-- Critical CSS: canvas colour (same values as global.scss) and the skip link, before the bundle -->
    <style>
      html, body { margin: 0; }
      html { background: linear-gradient(180deg, rgba(9,10,16,.88), rgba(9,10,16,.64)), url('/wallpaper.webp') center / cover fixed; }
      html[data-theme='light'] { background: linear-gradient(180deg, rgba(240,243,250,.9), rgba(240,243,250,.64)), url('/wallpaper.webp') center / cover fixed; }
      .skip-link { position: absolute; top: -100px; left: 16px; }
      .skip-link:focus { top: 16px; }
    </style>
  </head>
  <body>
    <!-- Skip navigation link for keyboard/screen reader accessibility -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
